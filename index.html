<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Lina's Birthday 🎀</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #fff5f8;
      color: #30303a;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(100%, 430px);
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #ffe1eb 0%, #fff5f8 42%, #ffffff 100%);
      overflow: hidden;
      position: relative;
    }

    .screen {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 28px 20px;
    }

    .screen.active {
      display: flex;
    }

    .badge {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(145deg, #ffd5e2, #f59db9);

      box-shadow:
        0 12px 35px rgba(210, 90, 130, 0.25),
        inset 0 0 0 4px rgba(255,255,255,0.65);
    }

    .badge span {
      font-size: 52px;
      font-weight: 900;
      color: white;
      text-shadow:
        0 3px 10px rgba(180, 60, 100, 0.25);
    }

    .title {
      margin: 0 0 12px;
      text-align: center;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 auto 30px;
      max-width: 350px;
      text-align: center;
      font-size: 16px;
      line-height: 1.55;
      color: #777783;
    }

    .btn {
      width: 100%;
      padding: 15px 18px;

      border: 0;
      border-radius: 16px;

      background: linear-gradient(
        135deg,
        #f06c96,
        #e94f84
      );

      color: white;
      font-size: 17px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(233, 79, 132, 0.25);

      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .decor {
      margin-top: 24px;
      text-align: center;
      font-size: 24px;
      letter-spacing: 8px;
    }

    .small {
      margin-top: 24px;
      text-align: center;
      color: #a0a0aa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ЭКРАН 1 -->
    <section id="screen1" class="screen active">

      <div class="badge">
        <span>22</span>
      </div>

      <h1 class="title">
        🎀 Лина, сегодня твой день!
      </h1>

      <p class="subtitle">
        Для тебя приготовлено небольшое путешествие,
        несколько сюрпризов и один особенный финал ✨
      </p>

      <button class="btn" onclick="startBirthday()">
        Начать 🎀
      </button>

      <div class="decor">
        ✨ 🌷 🎂 ✨
      </div>

      <div class="small">
        Создано специально для Лины
      </div>

    </section>


    <!-- ЭКРАН 2 -->
    <section id="screen2" class="screen">

      <div class="badge">
        <span>22</span>
      </div>

      <h1 class="title">
        🎂 Тебе сегодня 22!
      </h1>

      <p class="subtitle">
        Добро пожаловать в твой маленький праздничный день.
        Дальше будет ещё интереснее ✨
      </p>

      <button class="btn" onclick="nextScreen()">
        Продолжить ✨
      </button>

    </section>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentScreen = 1;

    function showScreen(number) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document
        .getElementById("screen" + number)
        .classList.add("active");

      window.scrollTo(0, 0);

      currentScreen = number;
    }

    function startBirthday() {
      showScreen(2);
    }

    function nextScreen() {
      showScreen(2);
    }
  </script>

</body>
</html>
